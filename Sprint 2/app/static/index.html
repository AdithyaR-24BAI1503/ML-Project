<!doctype html>
<html>
<head><meta charset="utf-8"><title>ChatBiz Sprint 2</title>
<style>
body{font-family:Arial;max-width:900px;margin:40px auto;padding:0 20px}
input,button{padding:10px;margin:4px}#result{white-space:pre-wrap;background:#f4f4f4;padding:15px}
table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #ddd;padding:8px}
</style></head>
<body>
<h1>ChatBiz — Sprint 2</h1>
<p>NLP command parser + client management demo.</p>
<input id="cmd" style="width:70%" placeholder="add client Rahul, 9876543210, rahul@gmail.com">
<button onclick="send()">Send</button><button onclick="loadClients()">Refresh</button>
<h3>Response</h3><div id="result">Ready.</div><div id="clients"></div>
<script>
async function send(){
 const r=await fetch("/api/messages",{method:"POST",headers:{"Content-Type":"application/json"},
 body:JSON.stringify({text:document.getElementById("cmd").value})});
 document.getElementById("result").textContent=JSON.stringify(await r.json(),null,2); loadClients();
}
async function loadClients(){
 const data=await (await fetch("/api/clients")).json();
 document.getElementById("clients").innerHTML="<h3>Clients</h3><table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th></tr>"+
 data.map(c=>`<tr><td>${c.id}</td><td>${c.name}</td><td>${c.phone||""}</td><td>${c.email||""}</td></tr>`).join("")+"</table>";
}
loadClients();
</script></body></html>
