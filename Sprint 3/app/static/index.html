<!doctype html>
<html><head><meta charset="utf-8"><title>ChatBiz Sprint 3</title>
<style>
body{font-family:Arial;max-width:950px;margin:35px auto;padding:0 20px}
input,button{padding:9px;margin:4px}.box{background:#f5f5f5;padding:15px;margin:10px 0;border-radius:8px}
</style></head>
<body>
<h1>ChatBiz — Sprint 3</h1>
<p>Invoice generation + PDF delivery demo.</p>
<div class="box">
<h3>Create Invoice</h3>
<input id="client" type="number" placeholder="Client ID">
<input id="desc" placeholder="Description">
<input id="amount" type="number" placeholder="Amount">
<input id="due" type="date">
<input id="upi" placeholder="UPI ID (optional)">
<button onclick="createInvoice()">Create Invoice</button>
</div>
<h3>Result</h3><pre id="result"></pre><h3>Invoices</h3><div id="list"></div>
<script>
async function createInvoice(){
 const body={client_id:Number(client.value),description:desc.value,amount:Number(amount.value),
 due_date:due.value,upi_id:upi.value||null};
 const r=await fetch("/api/invoices",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 document.getElementById("result").textContent=JSON.stringify(await r.json(),null,2); load();
}
async function load(){
 const data=await (await fetch("/api/invoices")).json();
 document.getElementById("list").innerHTML=data.map(i=>`<div class="box">
 <b>Invoice #${String(i.id).padStart(4,"0")}</b> — ${i.client_name} — Rs. ${i.amount}
 <br>Due: ${i.due_date} | ${i.status}
 <br><a href="/api/invoices/${i.id}/pdf" target="_blank">Open PDF</a>
 <button onclick="sendInvoice(${i.id})">Simulate WhatsApp Send</button>
 </div>`).join("");
}
async function sendInvoice(id){
 const r=await fetch(`/api/invoices/${id}/send`,{method:"POST"});
 document.getElementById("result").textContent=JSON.stringify(await r.json(),null,2);
}
load();
</script></body></html>
